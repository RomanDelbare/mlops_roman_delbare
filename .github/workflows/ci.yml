# Intégration continue : à chaque push et à chaque pull request vers main,
# GitHub installe l'environnement puis lance ruff et pytest.
# Si une étape échoue, la PR s'affiche en rouge avant la validation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verifications:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r envi_dev.txt

      - name: Vérifier le style (ruff)
        run: ruff check .

      - name: Lancer les tests (pytest)
        run: pytest
